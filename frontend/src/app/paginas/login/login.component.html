<section class="login">
  <form class="card form" (ngSubmit)="enviar()" autocomplete="on">
    <img class="logo" src="/logo.png" width="72" height="72" alt="Viaja en el Rojo" />
    <h1>Viaja en el Rojo</h1>
    <p class="sub">Sonic RS · Huamantla</p>

    <label>
      Usuario
      <input type="text" name="username" [(ngModel)]="username" autocomplete="username" required autofocus />
    </label>
    <label>
      Contraseña
      <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required />
    </label>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit" class="btn btn-acento grande" [disabled]="cargando">
      {{ cargando ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</section>

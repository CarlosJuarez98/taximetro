@if (esLogin) {
  <router-outlet />
} @else {
  <div class="shell" [class.fit-viaje]="esViaje">
    <header class="top">
      <div class="brand">
        <div class="logo-ring">
          <img class="brand-logo" src="/logo.png" width="64" height="64" alt="Viaja en el Rojo" />
        </div>
        <div class="brand-txt">
          <p class="brand-mark">Viaja en el Rojo</p>
          <p class="brand-sub">{{ nombre || 'Sonic RS' }}</p>
        </div>
      </div>
      @if (sesionActiva) {
        <button type="button" class="btn-salir" (click)="salir()">Salir</button>
      }
    </header>
    <main [class.fit]="esViaje">
      <router-outlet />
    </main>
    <nav class="nav-dock" aria-label="Secciones">
      @for (l of dockLinks; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="activo">
          <span class="dock-ico" aria-hidden="true">{{ l.icon }}</span>
          <span class="dock-lbl">{{ l.label }}</span>
        </a>
      }
    </nav>
  </div>
}

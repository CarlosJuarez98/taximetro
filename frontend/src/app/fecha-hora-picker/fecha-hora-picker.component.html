<div class="fhp" [class.compact]="compact()" [class.disabled]="disabled" [class.abierto]="abierto">
  <button
    type="button"
    class="fecha-trigger"
    [disabled]="disabled"
    [attr.aria-expanded]="abierto"
    [attr.aria-label]="ariaLabel()"
    (click)="toggle($event)"
  >
    <span class="fecha-texto">{{ textoFecha }}</span>
    <span class="fecha-hora-badge">{{ textoHora }}</span>
    <span class="fecha-ico" aria-hidden="true">▾</span>
  </button>

  <div class="time">
    @if (franjaHint) {
      <p class="time-label hint">{{ franjaHint }}</p>
    }
    @if (compact()) {
      <div class="time-selects">
        <label class="sel">
          Hora
          <select
            [disabled]="disabled"
            [value]="seleccionado.getHours()"
            (change)="onSelectHora($event)"
            aria-label="Hora"
          >
            @for (h of horas; track h) {
              <option [value]="h" [selected]="seleccionado.getHours() === h">
                {{ h.toString().padStart(2, '0') }}
              </option>
            }
          </select>
        </label>
        <label class="sel">
          Min
          <select
            [disabled]="disabled"
            [value]="seleccionado.getMinutes()"
            (change)="onSelectMinuto($event)"
            aria-label="Minutos"
          >
            @for (m of minutos; track m) {
              <option [value]="m" [selected]="seleccionado.getMinutes() === m">
                :{{ m.toString().padStart(2, '0') }}
              </option>
            }
          </select>
        </label>
      </div>
    } @else {
      <div class="time-row">
        <div class="time-block grow">
          <p class="time-label">Hora</p>
          <div class="horas" role="listbox" aria-label="Hora">
            @for (h of horas; track h) {
              <button
                type="button"
                class="h-btn"
                role="option"
                [class.activo]="seleccionado.getHours() === h"
                [attr.aria-selected]="seleccionado.getHours() === h"
                [disabled]="disabled"
                (click)="setHora(h)"
              >
                {{ h.toString().padStart(2, '0') }}
              </button>
            }
          </div>
        </div>
        <div class="time-block mins-block">
          <p class="time-label">Min</p>
          <div class="mins" role="group" aria-label="Minutos">
            @for (m of minutos; track m) {
              <button
                type="button"
                class="m-btn"
                [class.activo]="seleccionado.getMinutes() === m"
                [disabled]="disabled"
                (click)="setMinuto(m)"
              >
                :{{ m.toString().padStart(2, '0') }}
              </button>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>

<ng-template #popTpl>
  <div
    class="cal-pop"
    role="dialog"
    [attr.aria-label]="ariaLabel()"
    [ngStyle]="popStyle"
    (click)="$event.stopPropagation()"
    (mousedown)="$event.stopPropagation()"
    (wheel)="$event.stopPropagation()"
  >
    <div class="cal-cab">
      <button
        type="button"
        class="cal-nav"
        (click)="mesAnterior()"
        [disabled]="!puedeMesAnterior"
        aria-label="Mes anterior"
      >
        ‹
      </button>
      <strong class="cal-mes">{{ tituloMes }}</strong>
      <button
        type="button"
        class="cal-nav"
        (click)="mesSiguiente()"
        [disabled]="!puedeMesSiguiente"
        aria-label="Mes siguiente"
      >
        ›
      </button>
    </div>
    <div class="cal-grid dias-cab">
      @for (d of diasSemana; track d) {
        <span>{{ d }}</span>
      }
    </div>
    <div class="cal-grid">
      @for (c of celdas; track c.iso) {
        @if (c.fueraMes) {
          <span class="cal-dia cal-vacio" aria-hidden="true"></span>
        } @else {
          <button
            type="button"
            class="cal-dia"
            [class.disabled]="c.disabled"
            [class.inicio]="c.iso === valorIso"
            [class.fin]="c.iso === valorIso"
            [class.hoy]="c.iso === hoyIso"
            [disabled]="c.disabled"
            (click)="elegir(c)"
          >
            {{ c.dia }}
          </button>
        }
      }
    </div>
    <div class="cal-acc">
      <button type="button" class="btn btn-seco cal-btn" (click)="cerrar()">Cerrar</button>
    </div>
  </div>
</ng-template>

spring.application.name=taxi-huamantla
# Fijo — no cambiar. Taxi: front 4203 / API 8084
server.port=8084
server.address=0.0.0.0

# Local = sandbox (H2). Oracle/ATP cuando se pida nube.
spring.datasource.url=jdbc:h2:file:./data/taxi;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Mexico_City

server.servlet.session.timeout=12h
server.servlet.session.cookie.name=VIAJA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.cors.allowed-origin-patterns=*
app.geo.user-agent=TaxiHuamantla/1.0 (local; Huamantla Tlaxcala)

logging.level.root=INFO
logging.level.com.taxi=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
